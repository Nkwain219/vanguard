name: vanguard
description: "Vanguard — Premium Workforce Management Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.1
  firebase_auth: ^5.3.4
  firebase_storage: ^12.4.2
  firebase_messaging: ^15.1.6
  
  # Location & Device
  geolocator: ^13.0.2
  device_info_plus: ^11.3.3
  url_launcher: ^6.3.1
  
  # Offline Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Environment & HTTP
  flutter_dotenv: ^5.2.1
  http: ^1.2.2
  
  # Persistence
  shared_preferences: ^2.2.2
  
  # Cloud Functions
  cloud_functions: ^5.2.0

  # Internationalization
  intl: ^0.20.2

#  # Firebase Core (initialize Firebase)
#  firebase_core: ^2.24.2

  # Charts
  fl_chart: ^0.68.0

  # Animations
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  # UI Enhancements9
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1

  # Calendar
  table_calendar: ^3.0.9

  # Fonts
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
#      - assets/animations/
#      - assets/images/

  generate: true

# App Icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/ems_icon.png"
  adaptive_icon_background: "#080C18"
  adaptive_icon_foreground: "assets/icons/ems_icon.png"